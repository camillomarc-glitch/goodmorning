<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Morning</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #fbe3e1;
    --rose: #e8a5ad;
    --wine: #5e2233;
    --gold: #c99a5b;
    --cream: #fff8f1;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
    background:
      radial-gradient(ellipse at 50% 0%, #fff1dc 0%, transparent 55%),
      linear-gradient(180deg, var(--blush) 0%, var(--rose) 100%);
    color: var(--wine);
    font-family: "Cormorant Garamond", Georgia, serif;
    text-align: center;
    overflow-x: hidden;
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 440px; }

  .frame {
    width: 250px; height: 320px; margin: 0 auto 34px;
    border-radius: 125px 125px 14px 14px;
    background: var(--cream);
    border: 3px solid var(--gold);
    padding: 8px;
    box-shadow: 0 0 0 10px rgba(255,255,255,.4), 0 18px 50px rgba(94,34,51,.28);
    cursor: pointer; position: relative;
  }
  .frame .inner {
    width: 100%; height: 100%; overflow: hidden;
    border-radius: 117px 117px 8px 8px; position: relative;
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .frame.has-photo img { display: block; }
  .frame .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-size: 1.25rem; font-style: italic; line-height: 1.35;
  }
  .frame.has-photo .hint { display: none; }

  h1 {
    font-family: "Pinyon Script", "Brush Script MT", cursive;
    font-weight: 400; font-size: 3.6rem; line-height: 1.05; margin: 0 0 4px;
  }
  .name { font-size: 1.5rem; font-style: italic; margin: 0 0 22px; }
  .divider { width: 64px; height: 1px; background: var(--gold); margin: 0 auto 22px; }
  .message {
    font-size: 1.55rem; line-height: 1.5; font-style: italic;
    min-height: 6em; margin: 0 auto 26px; max-width: 28ch;
  }
  .sign { font-size: 1.1rem; margin: 0 0 24px; }

  button {
    font: inherit; font-size: 1.15rem; color: var(--wine);
    background: var(--cream); border: 1px solid var(--gold);
    border-radius: 999px; padding: 10px 28px; cursor: pointer;
  }
  button:hover { background: #fff; }
  :focus-visible { outline: 3px solid var(--wine); outline-offset: 3px; }
  .frame:focus-visible { outline-offset: 10px; }

  .petal {
    position: fixed; top: -30px; z-index: 0; pointer-events: none;
    width: 14px; height: 20px; border-radius: 80% 0 80% 0;
    background: rgba(255,255,255,.55);
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translate(var(--drift), 110vh) rotate(540deg); }
  }
  .message { transition: opacity .35s; }
  .message.fade { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .petal { display: none; }
    .message { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="frame" id="frame" tabindex="0" role="button" aria-label="Choose her photo">
    <div class="inner">
      <img id="photo" alt="Her photo">
      <div class="hint">Tap here to add her picture</div>
    </div>
  </div>

  <h1 id="greeting">Good morning</h1>
  <p class="name" id="name"></p>
  <div class="divider"></div>
  <p class="message" id="message"></p>
  <p class="sign" id="sign"></p>
  <button id="next" type="button">Another message</button>
  <input type="file" id="picker" accept="image/*" hidden>
</main>

<script>
  /* ====== EDIT THESE ====== */

  // Her name (leave "" to hide it)
  const HER_NAME = "babyyy";

  // Your name, shown at the bottom. Leave "" to hide it.
  const YOUR_NAME = "Mei";

  // Put her picture in the SAME folder as this file, then write its file name here.
  // Example: const PHOTO_FILE = "her.jpg";
  // Leave "" to click the frame and choose a picture each time.
  const PHOTO_FILE = "shamae.jpeg";

  // Your messages. Edit, add, or delete. Keep quotes and commas.
  // Write {name} anywhere and it becomes her name.
  const MESSAGES = [
    "Good morning, {dungo}. Before the day asks anything of you, I just want you to know you were my first thought.",
    "If mornings had a favorite person, they would choose you. I know I did.",
    "May your coffee be warm, your day be kind, and may you feel how much you are loved.",
    "Waking up is easier when I know you exist in the same world as me.",
    "Good morning, {dungo}. Whatever today brings, you do not have to face it alone.",
    "I hope the sun is gentle on you today, because you deserve a soft start.",
    "Out of every good thing in my life, you are the one I am most grateful for.",
    "Take a deep breath, smile a little, and know that someone is rooting for you all day long.",
    "You are the reason an ordinary morning feels like something worth waking up for.",
    "Good morning, {dungo}. I am proud of you, and I am thinking of you.",
    "Drink some water, eat something good, and remember that you are wonderful.",
    "Every day with you in my life is a day I did not expect to deserve, and I am thankful for it."
  ];

  /* ====== END OF EDITS ====== */

  const $ = id => document.getElementById(id);
  const frame = $("frame"), photo = $("photo"), picker = $("picker"), msg = $("message");

  $("name").textContent = HER_NAME;
  $("name").hidden = !HER_NAME;
  $("sign").textContent = YOUR_NAME ? "Always yours, " + YOUR_NAME : "";
  $("sign").hidden = !YOUR_NAME;

  /* Photo */
  function showPhoto(src) { photo.src = src; frame.classList.add("has-photo"); }
  if (PHOTO_FILE) {
    photo.onerror = () => frame.classList.remove("has-photo");
    showPhoto(PHOTO_FILE);
  }
  frame.addEventListener("click", () => picker.click());
  frame.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); }
  });
  picker.addEventListener("change", () => {
    if (picker.files[0]) showPhoto(URL.createObjectURL(picker.files[0]));
  });

  /* The first message is picked by the date, so she sees a different one each day.
     The button moves to the next message in the list. */
  const today = new Date();
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
  let i = dayOfYear % MESSAGES.length;

  const fill = text => text.replace(/\{name\}/g, HER_NAME || "baby");

  function show(animate) {
    const apply = () => { msg.textContent = fill(MESSAGES[i]); msg.classList.remove("fade"); };
    if (animate) { msg.classList.add("fade"); setTimeout(apply, 350); } else apply();
  }
  $("next").addEventListener("click", () => { i = (i + 1) % MESSAGES.length; show(true); });
  show(false);

  /* Petals */
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let n = 0; n < 16; n++) {
      const p = document.createElement("div");
      p.className = "petal";
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration = 9 + Math.random() * 9 + "s";
      p.style.animationDelay = -Math.random() * 14 + "s";
      p.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      p.style.opacity = 0.4 + Math.random() * 0.5;
      p.style.transform = "scale(" + (0.6 + Math.random() * 0.8) + ")";
      document.body.appendChild(p);
    }
  }
</script>
</body>
</html>
